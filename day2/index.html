<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form for 10th</title>
</head>
<body>
    <h1>Form for 10th</h1>
    <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Non magni hic architecto vero facere, quis dolores mollitia consequuntur quo rerum labore alias nulla.</div>
    
    <div>
        <label for="ah1">Enter your name:</label>
        <input type="text" id="ah1" name="name" placeholder="Enter your name">
    </div>
    <div>
        <input type="radio" id="2a" name="gender" value="male">
        <label for="2a">Male</label>
        <input type="radio" id="2b" name="gender" value="female">
        <label for="2b">Female</label>
    </div>
    <div>
        <label for="ah2">Enter your age:</label>
        <input type="number" id="ah2" name="age" placeholder="Enter your age" min="2" max="100">
    </div>
    <div>
        <input type="checkbox" id="ah3" name="hobby" value="reading">
        <label for="ah3">Reading</label>
        <input type="checkbox" id="ah4" name="hobby" value="sports">
        <label for="ah4">Sports</label>
    </div>
    <div>
        <label for="ah5">Select your country:
        </label>
        <select id="ah5" name="country">
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="india">India</option>
        </select>
    </div>
    <div>
        <label for="6a">Enter your password:</label>
        <input type="password" id="6a" name="password" placeholder="Enter your password" minlength="8">
    </div>
    <div>
        <label for="a7">Select a value:</label>
        <input type="range" name="rangebar" id="a7" min="0" max="100">
    </div>
    <div>
        <label for="a8">Select a date:</label>
        <input type="date" name="date" id="a8">
    </div>
</body>
</html>
