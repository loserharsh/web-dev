<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin border padding</title>
    <style>
        body{
            background-color:antiquewhite;
        }
        .style1{
            color: rgb(83, 58, 7);
            background-color:rgb(199, 199, 152);
            margin:10px;
            padding: 10px;
            border: 5px solid rgb(83, 58, 7);

        }

        #margin{
            margin: 20px;
        }
        #border{
            border: 5px solid rgb(83, 58, 7);
        }
        #padding{
            padding: 10px;
        }

    </style>
</head>
<body>
    <header id="header1" class="style1">
        <h1>
            MARGIN, BORDER, PADDING
        </h1>
    </header>
    <main id="main1">
        <div>
            <h2 id="margin">Margin</h2>
            <h2 id="border">Border</h2>
            <h2 id="padding">Padding</h2>

            <p class="style1"> 
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores in adipisci dolorum repudiandae quas architecto voluptatibus vel, quod et voluptate soluta iste nisi!
            </p>
        </div>
    </main>
    <footer id="footer">
        <p>Copyright &copy; 2024</p>
    </footer>
</body>
</html>
