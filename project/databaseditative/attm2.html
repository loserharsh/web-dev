<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="atm2.css">
</head>
<body>
    <div class="main"><img src="https://i.pinimg.com/1200x/53/0c/14/530c149fd66ec248a4374b9cd066ed2a.jpg" alt="github" style="z-index: -1; position: absolute; width: 100vw; height: 100vh; top: 0; right: 0;">
        <div class="apps">
            <div class="app1">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="github" style="width: 100%; height: 100%;">
            </div>
            <div class="app2">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="github" style="width: 100%; height: 100%;">
            </div>
            <div class="app3">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="github" style="width: 100%; height: 100%;">
            </div>
            <template id="box-template">
                <div class="box">
                    <div class="tbar">
                        <ul>
                            <li class="minimize"> -- </li>
                            <li class="maximize"> □ </li>
                            <li class="maximize1"> ⌂ </li>
                            <li class="close"> X </li>
                        </ul>
                    </div>
                </div>
            </template>
        </div>
        <div class="taskbar"></div>
    </div>
    <script src="atm.js"></script>
</body>

</html>
