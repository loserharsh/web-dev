<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="atm2.css">
</head>
<body>
    <div class="main"><img src="https://i.pinimg.com/1200x/53/0c/14/530c149fd66ec248a4374b9cd066ed2a.jpg" alt="github" style="z-index: -1; position: absolute; width: 100vw; height: 100vh; top: 0; right: 0;">
        <div class="apps">
            <div class="app1">
                <img src="https://i.pinimg.com/736x/49/d9/db/49d9dbde634d2582cce4a76e18e69ba4.jpg" alt="github" style="width: 100%; height: 100%;">
            </div>
            <div class="app2">
                <img src="https://i.pinimg.com/736x/6a/4c/5e/6a4c5ed675aa1963d956b54afee88482.jpg" alt="github" style="width: 100%; height: 100%;">
            </div>
            <div class="app3">
                <img src="https://i.pinimg.com/1200x/12/82/03/128203aa4c9be1aaf93d2a28c4901db4.jpg" alt="github" style="width: 100%; height: 100%;">
            </div>
            <div class="app4">
                <img src="https://i.pinimg.com/736x/37/0f/17/370f173b0099d61b7f2dc0150e1fbc4b.jpg" alt="github" style="width: 100%; height: 100%;">
            </div>
            <template id="box-template">
                <div class="box">
                    <div class="tbar">
                        <ul>
                            <li class="minimize"> -- </li>
                            <li class="maximize"> □ </li>
                            <li class="maximize1"> ⌂ </li>
                            <li class="close"> X </li>
                        </ul>
                    </div>
                    <div class="content">
                        <img class="box-img">
                    </div>
                </div>
            </template>
        </div>
        <div class="taskbar">
            <div class="taskbar-icons">
                
            </div>
        </div>
    </div>
    <script src="atm.js"></script>
</body>

</html>
